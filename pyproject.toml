[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-platform"
version = "1.0.0"
description = "Support platform simulation with repository-based storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.6", "mypy==2.3.1"]

[tool.setuptools.packages.find]
include = ["support_platform*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["support_platform", "scripts"]
strict = true
